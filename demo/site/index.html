<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CodeUse Demo Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>CodeUse Demo</h1>
  <p>Page includes intentional UX issues for the audit demo.</p>

  <button id="btn1" class="cta">Primary CTA</button>
  <div class="overlay">overlay</div>

  <p><a href="/dead-link-404">Broken link (404)</a></p>
  <img src="https://via.placeholder.com/150">

  <button class="tiny-btn">OK</button>

  <script>
    const trackedButtons = document.querySelectorAll("button");
    trackedButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        btn.classList.add("clicked");
      });
    });
  </script>
</body>
</html>
