<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hello Playwright Test</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello Playwright Test Page</h1>
  <button id="hello-btn">Click me</button>
  <p id="output"></p>

  <script>
    const btn = document.getElementById("hello-btn");
    const output = document.getElementById("output");

    btn.addEventListener("click", () => {
      output.textContent = "Hello Playwright!";
    });
  </script>
</body>
</html>
